name: Container Image Scan

on:
  push:
    branches: [main]     # 当主分支push时触发，也可换成你自己的分支或事件

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Scan container image with Anchore
        id: scan
        uses: anchore/scan-action@v7
        with:
          image: casthighlight/cli:5.11.15
          fail-build: true
          severity-cutoff: high
          output-format: json

      - name: Upload Anchore scan JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchore-scan-report
          path: ${{ steps.scan.outputs.json }}
